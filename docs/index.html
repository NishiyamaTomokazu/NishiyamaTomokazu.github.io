<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad FSK Terminal v3</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f2f2f7; color: #1c1c1e; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; text-align: center; }
        
        button {
            width: 100%; padding: 14px; margin: 8px 0;
            font-size: 16px; font-weight: bold; border: none; border-radius: 10px;
            color: white; cursor: pointer; transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        button:disabled { background-color: #c7c7cc; color: #8e8e93; cursor: not-allowed; }

        .btn-init { background-color: #007AFF; }
        .btn-tx { background-color: #34C759; }
        .btn-start { background-color: #007AFF; }
        .btn-stop { background-color: #FF3B30; }
        .btn-clear { background-color: #8E8E93; }

        .button-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        
        textarea { width: 100%; height: 120px; font-family: 'Menlo', 'Courier New', monospace; font-size: 16px; border: 1px solid #c7c7cc; border-radius: 8px; padding: 10px; box-sizing: border-box; -webkit-appearance: none; background: #fafafa; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #c7c7cc; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; -webkit-appearance: none;}
        
        .status { margin: 10px 0; color: #8e8e93; font-size: 14px; text-align: center; height: 20px; font-weight: bold;}
        .control-group { margin-bottom: 24px; border-top: 1px solid #e5e5ea; padding-top: 20px; }
        #errorMsg { color: #ff3b30; font-size: 14px; text-align: center; display: none; margin-bottom: 10px;}
    </style>
</head>
<body>

<div class="container">
    <h2>FSK Terminal (300bps)</h2>
    <div id="errorMsg"></div>

    <div id="initArea">
        <p style="text-align:center;">マイク許可とオーディオ再生の準備</p>
        <button onclick="initAudio()" id="initBtn" class="btn-init">オーディオ機能を開始 (タップ)</button>
    </div>

    <div id="mainArea" style="display:none;">
        <div class="status" id="statusText">待機中</div>

        <div class="control-group">
            <h3>受信操作 (Rx)</h3>
            <div class="button-group">
                <button onclick="startRx()" class="btn-start">受信開始</button>
                <button onclick="stopRx()" class="btn-stop">受信停止</button>
                <button onclick="clearLog()" class="btn-clear">クリア</button>
            </div>
            <textarea id="rxLog" readonly placeholder="待機中... スタートビット(0)を検出すると表示します"></textarea>
        </div>

        <div class="control-group">
            <h3>送信 (Tx)</h3>
            <input type="text" id="txInput" value="Hello" placeholder="送信する文字">
            <button onclick="sendText()" class="btn-tx">送信実行</button>
        </div>
    </div>
</div>

<script>
    // --- 定数定義 ---
    const BAUD_RATE = 300;
    const FREQ_0 = 1200; // Start Bit & Logic 0
    const FREQ_1 = 2400; // Stop Bit & Logic 1
    const BIT_TIME = 1 / BAUD_RATE; 

    // --- グローバル変数 ---
    let audioCtx = null;
    let microphoneStream = null;
    let scriptProcessor = null;
    let isRxEnabled = false; // 受信機能有効フラグ

    // --- 受信ステートマシン用変数 ---
    let sampleRate = 0;
    let samplesPerBit = 0;
    
    // ステート定義: 
    // 0: IDLE (アイドル/待機状態) - スタートビット(0)が来るのを待つ
    // 1: DATA (データ受信中) - 8ビットを受信
    // 2: STOP (ストップビット) - ストップビット(1)を確認して終了
    let rxState = 0; 
    
    let rxBitIndex = 0; // 受信中のビットカウント (0-7)
    let rxByteBuffer = 0; // 受信中のバイトデータ組み立て用
    let idleCounter = 0; // ノイズ防止用：アイドル(1)が連続しているか確認

    // ゼロクロス検出用
    let lastSample = 0;
    let zeroCrossCount = 0;
    let samplesInWindow = 0;

    // --- UI関連ヘルパー ---
    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.innerText = msg;
        el.style.display = 'block';
    }
    function updateStatus(msg) {
        document.getElementById('statusText').innerText = msg;
    }
    function logData(text) {
        const ta = document.getElementById('rxLog');
        ta.value += text;
        ta.scrollTop = ta.scrollHeight;
    }

    // --- 1. 初期化処理 ---
    async function initAudio() {
        const btn = document.getElementById('initBtn');
        btn.disabled = true;
        btn.innerText = "初期化中...";

        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            // ダミー音再生 (iOS対策)
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            src.connect(audioCtx.destination);
            src.start(0);

            // マイク入力設定
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
            });
            microphoneStream = audioCtx.createMediaStreamSource(stream);
            
            // ScriptProcessor作成 (バッファサイズ4096)
            scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
            microphoneStream.connect(scriptProcessor);
            scriptProcessor.connect(audioCtx.destination);
            scriptProcessor.onaudioprocess = processAudioInput;

            sampleRate = audioCtx.sampleRate;
            samplesPerBit = Math.floor(sampleRate / BAUD_RATE);

            // 画面遷移
            document.getElementById('initArea').style.display = 'none';
            document.getElementById('mainArea').style.display = 'block';
            stopRx(); // 初期状態は停止

        } catch (e) {
            showError("初期化エラー: " + e.message);
            btn.disabled = false;
        }
    }

    // --- 2. ボタン操作 ---
    function startRx() {
        if (!audioCtx) return;
        isRxEnabled = true;
        
        // 変数リセット
        rxState = 0; // IDLEへ
        idleCounter = 0;
        zeroCrossCount = 0;
        samplesInWindow = 0;
        rxByteBuffer = 0;
        
        updateStatus("● 受信中 (スタートビット待ち...)");
    }

    function stopRx() {
        isRxEnabled = false;
        updateStatus("■ 受信停止中");
    }

    function clearLog() {
        document.getElementById('rxLog').value = "";
    }

    // --- 3. 受信ロジック (Signal Processing) ---
    function processAudioInput(e) {
        if (!isRxEnabled) return; // 停止中は処理しない

        const inputData = e.inputBuffer.getChannelData(0);

        for (let i = 0; i < inputData.length; i++) {
            const sample = inputData[i];

            // ゼロクロス検出
            if ((lastSample >= 0 && sample < 0) || (lastSample < 0 && sample >= 0)) {
                zeroCrossCount++;
            }
            lastSample = sample;
            samplesInWindow++;

            // 1ビット分の時間が経過したら判定を行う
            if (samplesInWindow >= samplesPerBit) {
                // 周波数判定
                // 1200Hz(0) なら約8回のエッジ
                // 2400Hz(1) なら約16回のエッジ
                // 閾値を12とする
                const bit = (zeroCrossCount > 12) ? 1 : 0;

                // ステートマシン実行
                runRxStateMachine(bit);

                // 次のビットのためにリセット
                zeroCrossCount = 0;
                samplesInWindow = 0;
            }
        }
    }

    // 受信ステートマシン
    function runRxStateMachine(bit) {
        switch (rxState) {
            // [State 0] IDLE: スタートビット(0)待ち
            case 0:
                if (bit === 1) {
                    // アイドル状態(1)を観測中
                    // ノイズ防止のため、ある程度連続して1が来ていたことをカウントしてもよい
                    idleCounter++; 
                } else {
                    // 0 を検出！ -> スタートビットの可能性
                    // 誤検知防止: 直前までアイドル(1)がある程度あった場合のみスタートとみなす
                    // (ここでは簡易的に直前が1であればOKとします)
                    if (idleCounter > 0) {
                        // ★スタートビット検出★
                        rxState = 1; // データ受信へ移行
                        rxBitIndex = 0;
                        rxByteBuffer = 0;
                        updateStatus("受信中: データ解析...");
                    }
                    idleCounter = 0; // カウンタリセット
                }
                break;

            // [State 1] DATA: 8ビット受信 (LSB First)
            case 1:
                // 現在のbitをバッファに追加
                // LSB Firstなので、index分だけ左シフトしてORをとる
                if (bit === 1) {
                    rxByteBuffer |= (1 << rxBitIndex);
                }
                
                rxBitIndex++;

                // 8ビット受け取ったらストップビット待ちへ
                if (rxBitIndex >= 8) {
                    rxState = 2;
                }
                break;

            // [State 2] STOP: ストップビット(1)確認
            case 2:
                // 仕様ではストップビットは "1"
                if (bit === 1) {
                    // 正しく受信完了 -> 表示
                    const hex = rxByteBuffer.toString(16).toUpperCase().padStart(2, '0');
                    logData("0x" + hex + " ");
                } else {
                    // フレーミングエラー (ストップビットが0だった)
                    // logData("[Err] ");
                }

                // 次のデータのためにIDLEへ戻る
                rxState = 0;
                idleCounter = 1; // 今1(StopBit)を受け取ったのでアイドル扱い開始
                updateStatus("● 受信中 (スタートビット待ち...)");
                break;
        }
    }

    // --- 4. 送信処理 ---
    function sendText() {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const text = document.getElementById('txInput').value;
        if (!text) return;

        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = 'sine';
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);

        const startTime = audioCtx.currentTime + 0.05;
        let t = startTime;

        // アイドル (Mark = 1)
        oscillator.frequency.setValueAtTime(FREQ_1, t);
        t += BIT_TIME * 2;

        // データ送信
        for (let i = 0; i < text.length; i++) {
            const charCode = text.charCodeAt(i);
            
            // Start Bit (0)
            oscillator.frequency.setValueAtTime(FREQ_0, t);
            t += BIT_TIME;

            // Data Bits (8bit, LSB first)
            for (let b = 0; b < 8; b++) {
                const bVal = (charCode >> b) & 1;
                oscillator.frequency.setValueAtTime(bVal ? FREQ_1 : FREQ_0, t);
                t += BIT_TIME;
            }

            // Stop Bit (1)
            oscillator.frequency.setValueAtTime(FREQ_1, t);
            t += BIT_TIME;
        }

        oscillator.start(startTime);
        oscillator.stop(t);
        
        // 表示制御
        const currentMsg = document.getElementById('statusText').innerText;
        updateStatus("▲ 送信中...");
        setTimeout(() => {
            updateStatus(currentMsg.includes("停止") ? "■ 受信停止中" : "● 受信中 (スタートビット待ち...)");
        }, (t - audioCtx.currentTime) * 1000);
    }
</script>

</body>
</html>

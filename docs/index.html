<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIじゃんけんゲーム - 完成版</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f8ff; margin: 0; padding: 20px; }
        .game-board { background-color: white; border-radius: 10px; padding: 20px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .video-container { margin: 10px auto; width: 100%; max-width: 320px; border-radius: 8px; overflow: hidden; background-color: #000; position: relative; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        .ai-status { background-color: #333; color: #00ff00; padding: 10px; border-radius: 5px; font-family: monospace; margin: 10px 0; }
        .hands { display: flex; justify-content: space-around; font-size: 24px; margin: 20px 0; }
        .hand-box { width: 45%; }
        .hand-emoji { font-size: 64px; margin-top: 10px; }
        .result-message { font-size: 28px; font-weight: bold; color: #333; margin: 20px 0; min-height: 40px; }
        
        /* スタートボタンを目立たせるスタイル */
        #start-btn {
            font-size: 22px;
            font-weight: bold;
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #ff4500;
            color: white;
            transition: background-color 0.3s, transform 0.1s;
            width: 100%;
            box-sizing: border-box;
        }
        #start-btn:hover { background-color: #cc3700; }
        #start-btn:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="game-board">
    <h1>AIカメラじゃんけん</h1>
    
    <div id="ai-status" class="ai-status">AI: モデルを読み込み中...</div>

    <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div class="hands">
        <div class="hand-box">
            <p>あなた</p>
            <div id="player-hand" class="hand-emoji">❓</div>
        </div>
        <div class="hand-box">
            <p>CPU</p>
            <div id="cpu-hand" class="hand-emoji">❓</div>
        </div>
    </div>
    
    <div class="result-message" id="result-message">準備ができたらスタート！</div>

    <button id="start-btn" onclick="startJanken()" disabled>🎮 ゲームスタート！</button>
</div>

<script type="module">
    import { GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const videoElement = document.getElementById('webcam');
    const aiStatusElement = document.getElementById('ai-status');
    const startBtn = document.getElementById('start-btn');
    const resultMessage = document.getElementById('result-message');
    
    let gestureRecognizer;
    let webcamRunning = false;
    let lastVideoTime = -1;
    
    // 現在AIが認識している手を保持する変数 (-1: 未認識, 0: グー, 1: チョキ, 2: パー)
    let currentGesture = -1; 
    const handSymbols = ["✊", "✌️", "✋"];

    // --- 1. AIモデルの読み込みと初期化 ---
    async function initializeMediaPipe() {
        try {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO"
            });
            aiStatusElement.innerText = "AI: 準備完了！";
            startCamera();
        } catch (error) {
            console.error(error);
            aiStatusElement.innerText = "AI: 初期化エラー";
        }
    }

    // --- 2. カメラの起動 ---
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            videoElement.srcObject = stream;
            videoElement.addEventListener("loadeddata", predictWebcam);
            webcamRunning = true;
            startBtn.disabled = false; // カメラが起動したらスタートボタンを有効化
        } catch (error) {
            console.error(error);
            aiStatusElement.innerText = "AI: カメラへのアクセスが拒否されました";
        }
    }

    // --- 3. 手の形をリアルタイム推論 ---
    async function predictWebcam() {
        if (!webcamRunning) return;

        let nowInMs = Date.now();
        if (videoElement.currentTime !== lastVideoTime) {
            lastVideoTime = videoElement.currentTime;
            const results = gestureRecognizer.recognizeForVideo(videoElement, nowInMs);

            if (results.gestures.length > 0) {
                const categoryName = results.gestures[0][0].categoryName;
                if (categoryName === "Closed_Fist") {
                    currentGesture = 0;
                    aiStatusElement.innerText = "AI: 【✊ グー】";
                } else if (categoryName === "Victory") {
                    currentGesture = 1;
                    aiStatusElement.innerText = "AI: 【✌️ チョキ】";
                } else if (categoryName === "Open_Palm") {
                    currentGesture = 2;
                    aiStatusElement.innerText = "AI: 【✋ パー】";
                } else {
                    currentGesture = -1;
                    aiStatusElement.innerText = "AI: 手を認識中...";
                }
            } else {
                currentGesture = -1;
                aiStatusElement.innerText = "AI: 手が見つかりません";
            }
        }
        window.requestAnimationFrame(predictWebcam);
    }

    initializeMediaPipe();

    // --- 4. じゃんけんのゲームフロー制御 ---
    window.startJanken = function() {
        // ボタンを連打できないように無効化
        startBtn.disabled = true;
        
        // UIのリセット
        document.getElementById("player-hand").innerText = "✊";
        document.getElementById("cpu-hand").innerText = "✊";
        resultMessage.style.color = "#333";
        
        // カウントダウン処理 (setTimeoutを利用)
        resultMessage.innerText = "最初はグー！";
        
        setTimeout(() => {
            resultMessage.innerText = "じゃんけん...";
        }, 1200);

        setTimeout(() => {
            resultMessage.innerText = "ポン！";
            judgeGame(); // ここで勝敗判定を呼び出す
        }, 2400);
    }

    // --- 5. 勝敗判定 ---
    function judgeGame() {
        // AIが手を認識できていない場合
        if (currentGesture === -1) {
            resultMessage.innerText = "手が認識できませんでした。もう一度！";
            document.getElementById("player-hand").innerText = "❓";
            startBtn.disabled = false;
            return;
        }

        // CPUの手をランダム決定
        const cpuChoice = Math.floor(Math.random() * 3);
        
        // 画面更新
        document.getElementById("player-hand").innerText = handSymbols[currentGesture];
        document.getElementById("cpu-hand").innerText = handSymbols[cpuChoice];

        // 勝敗計算
        const result = (currentGesture - cpuChoice + 3) % 3;
        
        if (result === 0) {
            resultMessage.innerText = "あいこ！";
            resultMessage.style.color = "#333";
        } else if (result === 1) {
            resultMessage.innerText = "あなたの負け...";
            resultMessage.style.color = "#007bff";
        } else if (result === 2) {
            resultMessage.innerText = "あなたの勝ち！🎉";
            resultMessage.style.color = "#ff4500";
        }

        // ボタンを再び押せるようにする
        startBtn.disabled = false;
    }
</script>

</body>
</html>

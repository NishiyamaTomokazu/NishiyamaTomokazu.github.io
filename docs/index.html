<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FSK復調テスト（iPad Safari対応）</title>
<style>
body {
    font-family: sans-serif;
    margin: 20px;
}
textarea {
    width: 100%;
    height: 200px;
}
button {
    margin-right: 10px;
    margin-top: 5px;
}
</style>
</head>
<body>

<!--
==========================================================
【動作確認手順（iPad Safari 推奨）】
==========================================================

1. iPad の Safari で本 HTML を開く
2. 「開始」ボタンを押す（Safari がマイク権限を要求 → 許可）
3. 別のマイコンまたは本アプリの「テスト送信」機能で
   1200/2400Hz FSK (300bps, LSB first) を送信
4. スタートバイト 0x7E を検出すると同期し、
   後続バイトが 16進数でテキストエリアに表示される
5. テスト送信モードで自己ループ動作（マイク経由）を確認可能
6. 「ログ消去」で受信履歴をクリア可能

==========================================================
-->

<h2>FSK復調テスト（マイク入力）</h2>

<button id="startBtn">開始</button>
<button id="stopBtn">停止</button>
<button id="clearBtn">ログ消去</button>
<button id="testBtn">テスト送信（ON/OFF）</button>

<p>受信ログ（1バイトごとに16進で記録）</p>
<textarea id="log" readonly></textarea>

<script>
// =====================================================
// 仕様:
//  - 0ビット = 1200Hz
//  - 1ビット = 2400Hz
//  - ボーレート = 300bps (1bit ≒ 3.33ms)
//  - LSB first
//  - スタートバイト 0x7E を検出して同期
//  - iPad Safari で getUserMedia + AudioWorklet を利用
// =====================================================

// UI要素
const startBtn = document.getElementById("startBtn");
const stopBtn  = document.getElementById("stopBtn");
const clearBtn = document.getElementById("clearBtn");
const logArea  = document.getElementById("log");
const testBtn  = document.getElementById("testBtn");

// WebAudio変数
let audioCtx = null;
let micStream = null;
let testOsc = null;

// 復調用パラメータ
const bitRate = 300;
const bitDuration = 1 / bitRate;
const freq0 = 1200;   // 0ビット
const freq1 = 2400;   // 1ビット
let sampleRate = 44100;

// Goertzel処理用のワークレットファイルを動的生成
// AudioWorkletProcessor を1ファイルHTML内に埋め込むための DataURL
const workletCode = `
class FSKDemodWorklet extends AudioWorkletProcessor {

    constructor() {
        super();
        // サンプルレート取得
        this.fs = sampleRate;
        // ビット時間（サンプル数）
        this.bitSamples = Math.floor(this.fs / 300);

        // 周波数検出用のGoertzel係数
        this.k0 = Math.round(this.bitSamples * 1200 / this.fs);
        this.k1 = Math.round(this.bitSamples * 2400 / this.fs);

        this.w0 = 2 * Math.PI * this.k0 / this.bitSamples;
        this.w1 = 2 * Math.PI * this.k1 / this.bitSamples;

        // バッファ（ビット長分貯める）
        this.buffer = [];

        // 復号状態
        this.bitCount = 0;
        this.currentByte = 0;
        this.synced = false;

        this.port.onmessage = (event) => {
            if (event.data === "reset") {
                this.synced = false;
                this.bitCount = 0;
            }
        };
    }

    // Goertzelのパワー計算
    goertzelPower(samples, w) {
        let s_prev = 0, s_prev2 = 0;
        const coeff = 2 * Math.cos(w);
        for (let i = 0; i < samples.length; i++) {
            let s = samples[i] + coeff * s_prev - s_prev2;
            s_prev2 = s_prev;
            s_prev = s;
        }
        return s_prev2 * s_prev2 + s_prev * s_prev - coeff * s_prev * s_prev2;
    }

    process(inputs) {
        const input = inputs[0];
        if (!input || input.length === 0) return true;
        const ch = input[0];

        for (let i = 0; i < ch.length; i++) {
            this.buffer.push(ch[i]);

            // ビット長分たまったら処理
            if (this.buffer.length >= this.bitSamples) {
                const block = this.buffer.slice(0, this.bitSamples);
                this.buffer = this.buffer.slice(this.bitSamples);

                // 周波数判定
                const p0 = this.goertzelPower(block, this.w0);
                const p1 = this.goertzelPower(block, this.w1);

                const bit = (p1 > p0) ? 1 : 0;

                // 同期していない時はスタートバイトを探す
                if (!this.synced) {
                    this.currentByte = (this.currentByte >> 1) | (bit << 7);
                    this.bitCount++;

                    if (this.bitCount >= 8) {
                        if (this.currentByte === 0x7E) {
                            this.synced = true;
                            this.port.postMessage({type: "startByte"});
                        }
                        this.bitCount = 0;
                        this.currentByte = 0;
                    }
                }
                else {
                    // 同期後は通常バイト受信
                    this.currentByte = this.currentByte >> 1;
                    if (bit) this.currentByte |= 0x80;
                    this.bitCount++;

                    if (this.bitCount >= 8) {
                        this.port.postMessage({type: "byte", value: this.currentByte});
                        this.bitCount = 0;
                        this.currentByte = 0;
                    }
                }
            }
        }
        return true;
    }
}
registerProcessor("fsk-demod", FSKDemodWorklet);
`;

// ==========================
// ログ追記
// ==========================
function appendLog(txt) {
    logArea.value += txt + " ";
    logArea.scrollTop = logArea.scrollHeight;
}

// ==========================
// テスト送信（FSK生成）
// ==========================
function toggleTestTone() {
    if (!audioCtx) audioCtx = new AudioContext();

    if (testOsc) {
        testOsc.stop();
        testOsc = null;
        testBtn.textContent = "テスト送信（ON/OFF）";
        return;
    }

    // テスト送信用（簡易版：スタートバイト0x7E + カウンタ）
    testOsc = audioCtx.createOscillator();
    const freqNode = audioCtx.createConstantSource();
    const gain = audioCtx.createGain();

    gain.gain.value = 0.3;

    freqNode.connect(testOsc.frequency);
    testOsc.connect(gain).connect(audioCtx.destination);

    freqNode.start();
    testOsc.start();

    let byte = 0x7E;
    let counter = 0;

    function sendByte(b) {
        for (let i = 0; i < 8; i++) {
            const bit = (b >> i) & 1;
            freqNode.offset.setValueAtTime(bit ? 2400 : 1200, audioCtx.currentTime + i * bitDuration);
        }
    }

    setInterval(() => {
        sendByte(byte);
        byte = (byte + 1) & 0xFF;
    }, 8 * bitDuration * 1000);

    testBtn.textContent = "テスト送信（停止）";
}

// ==========================
// FSK復調開始
// ==========================
async function startFSK() {
    if (audioCtx) return;

    audioCtx = new AudioContext();
    sampleRate = audioCtx.sampleRate; // 実際のfsを取得

    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

    const src = audioCtx.createMediaStreamSource(micStream);

    // AudioWorklet登録
    const blob = new Blob([workletCode], { type: "application/javascript" });
    const url = URL.createObjectURL(blob);
    await audioCtx.audioWorklet.addModule(url);

    // Worklet生成
    const demod = new AudioWorkletNode(audioCtx, "fsk-demod");

    // 結果受信
    demod.port.onmessage = e => {
        const msg = e.data;
        if (msg.type === "startByte") {
            appendLog("[7E]");
        }
        else if (msg.type === "byte") {
            appendLog("0x" + msg.value.toString(16).padStart(2, "0"));
        }
    };

    src.connect(demod);

    appendLog("=== 受信開始 ===");
}

// ==========================
// 停止
// ==========================
function stopFSK() {
    if (micStream) {
        const tracks = micStream.getTracks();
        tracks.forEach(t => t.stop());
        micStream = null;
    }
    if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
    }
    appendLog("=== 停止 ===");
}

// ==========================
// ログ消去
// ==========================
function clearLog() {
    logArea.value = "";
}

// ==========================
// ボタン動作
// ==========================
startBtn.onclick = startFSK;
stopBtn.onclick  = stopFSK;
clearBtn.onclick = clearLog;
testBtn.onclick  = toggleTestTone;

</script>
</body>
</html>

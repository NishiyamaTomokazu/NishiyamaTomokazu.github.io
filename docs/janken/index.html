<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>じゃんけんアプリ</title>
    <link rel="stylesheet" href="./css/style.css">

</head>

<body class="index-body">

    <div class="tabs">
        <button class="tab-btn active" onclick="loadTab('index1.html', this)">ステップ1</button>
        <button class="tab-btn" onclick="loadTab('index2.html', this)">ステップ2</button>
        <button class="tab-btn" onclick="loadTab('index3.html', this)">ステップ3</button>
        <button class="tab-btn" onclick="loadTab('index4.html', this)">ステップ4</button>
        <button class="tab-btn" onclick="loadTab('index5.html', this)">ステップ5</button>

        <!-- ★追加: ヘルプボタン -->
        <button class="tab-btn" id="help-btn" onclick="openHelp()">❓ ヘルプを開く</button>
    </div>

    <iframe id="content-frame" src="index1.html" allow="camera; hid"></iframe>

    <!-- ==================================================
         ★追加: ヘルプ表示用のダイアログ
         ================================================== -->
    <dialog id="help-dialog">
        <div class="dialog-header">
            <h3>ヘルプ</h3>
            <button class="close-btn" onclick="closeHelp()">閉じる</button>
        </div>
        <!-- ヘルプ用のHTMLを読み込むiframe -->
        <iframe id="help-frame" style="width: 100%; height: calc(100% - 50px); border: none;"></iframe>
    </dialog>

    <script>
        // 現在開いているタブに対応するヘルプのファイル名（初期値はステップ1）
        let currentHelpUrl = 'help/index1_help.html';

        function loadTab(url, btnElement) {
            const frame = document.getElementById('content-frame');

            // ==================================================
            // ★追加: 読み込むページに合わせてヘルプファイルのURLを作る
            // (例: 'index2.html' -> 'index2_help.html')
            // ==================================================
            currentHelpUrl ='help/' + url.replace('.html', '_help.html');

            try {
                if (frame.contentWindow && typeof frame.contentWindow.stopAI === 'function') {
                    frame.contentWindow.stopAI();
                }
            } catch (error) {
                console.warn("停止処理スキップ: ", error);
            }

            frame.src = url;

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // ==================================================
        // ★追加: ヘルプを開閉する関数
        // ==================================================
        function openHelp() {
            const dialog = document.getElementById('help-dialog');
            const helpFrame = document.getElementById('help-frame');
            // 表示する直前にiframeにヘルプのURLをセットする
            helpFrame.src = currentHelpUrl;
            dialog.showModal();
        }

        function closeHelp() {
            const dialog = document.getElementById('help-dialog');
            dialog.close();
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIじゃんけん × Blockly連携</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>
    
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0px 20px 20px;
        }

        .app-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px; /* ブロックを置くために少し広げました */
            margin: 0 auto;
        }

        .panel {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 300px;
        }

        .header-controls {
            margin-bottom: 15px;
        }

        #toggle-ai-btn {
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #ffc107;
            color: #333;
            transition: background-color 0.3s;
        }

        .video-container {
            margin: 10px auto;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }

        video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        .prob-display {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            font-weight: bold;
            font-size: 16px;
        }

        .prob-item {
            padding: 8px;
            border-radius: 5px;
            background: #f8f9fa;
            width: 30%;
            border: 1px solid #ddd;
        }

        .training-panel {
            background: #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .train-btn {
            font-size: 16px;
            padding: 10px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            width: 90%;
            font-weight: bold;
        }

        #btn-rock { background-color: #e74c3c; }
        #btn-scissors { background-color: #2ecc71; }
        #btn-paper { background-color: #3498db; }

        .train-btn:active { opacity: 0.8; }
        .train-btn:disabled { background-color: #aaa; cursor: not-allowed; }

        .hands {
            display: flex;
            justify-content: space-around;
            font-size: 20px;
            margin: 15px 0;
        }

        .hand-emoji {
            font-size: 64px;
            margin-top: 5px;
        }

        .result-message {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin: 15px 0;
            min-height: 35px;
        }

        #start-btn {
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #ff4500;
            color: rgb(0, 0, 0);
            width: 100%;
        }

        #start-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        h1 { margin-top: 0; }

        /* 追加: Blockly用のスタイル */
        #blocklyDiv {
            height: 400px;
            width: 100%;
            border: 1px solid #ccc;
            margin-top: 20px;
            text-align: left; /* ブロックの文字が中央揃えにならないように */
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <h1>AIカメラじゃんけん 3ページ目</h1>

    <div class="header-controls">
        <button id="toggle-ai-btn" onclick="toggleAI()" disabled>⏸ AIを一時停止 (発熱対策)</button>
        <div id="ai-status" style="font-weight: bold; color: #007bff; margin-top: 10px;">AI: 起動準備中... (少々お待ちください)</div>
    </div>

    <div class="app-container">
        <div class="panel">
            <h2>1. AIに手を教える</h2>
            <div class="video-container">
                <video id="webcam" autoplay playsinline width="224" height="224"></video>
            </div>

            <div class="prob-display">
                <div class="prob-item" id="prob-0">✊ 0%</div>
                <div class="prob-item" id="prob-1">✌️ 0%</div>
                <div class="prob-item" id="prob-2">✋ 0%</div>
            </div>

            <div class="training-panel">
                <p style="margin-top:0; font-size:14px;" id="training-msg">ボタンを長押しして学習させてください</p>
                
                <button id="btn-rock" class="train-btn" 
                    onmousedown="startTraining(0)" onmouseup="stopTraining()" onmouseleave="stopTraining()"
                    ontouchstart="startTraining(0); event.preventDefault();" ontouchend="stopTraining()" ontouchcancel="stopTraining()"
                    disabled>✊ グー追加 (0)</button>
                    
                <button id="btn-scissors" class="train-btn" 
                    onmousedown="startTraining(1)" onmouseup="stopTraining()" onmouseleave="stopTraining()"
                    ontouchstart="startTraining(1); event.preventDefault();" ontouchend="stopTraining()" ontouchcancel="stopTraining()"
                    disabled>✌️ チョキ追加 (0)</button>
                    
                <button id="btn-paper" class="train-btn" 
                    onmousedown="startTraining(2)" onmouseup="stopTraining()" onmouseleave="stopTraining()"
                    ontouchstart="startTraining(2); event.preventDefault();" ontouchend="stopTraining()" ontouchcancel="stopTraining()"
                    disabled>✋ パー追加 (0)</button>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="resetModel()" style="padding: 8px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; flex: 1;">学習をリセット</button>
                <!-- <button onclick="saveKNN()" style="padding: 8px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; flex: 1;">💾 データを保存</button>
                <button onclick="loadKNN()" style="padding: 8px; background: #17a2b8; color: white; border: none; border-radius: 5px; cursor: pointer; flex: 1;">📂 データを読込</button> -->
            </div>
        </div>

        <div class="panel">
            <h2>2. AIと対戦する</h2>
            <div class="hands">
                <div>
                    <p>あなた</p>
                    <div id="player-hand" class="hand-emoji">❓</div>
                </div>
                <div>
                    <p>CPU</p>
                    <div id="cpu-hand" class="hand-emoji">❓</div>
                </div>
            </div>

            <div class="result-message" id="result-message">全ての形を学習させたらスタート！</div>
            <button id="start-btn" onclick="startJanken()" disabled>ゲームスタート！</button>

            <div id="blocklyDiv"></div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const statusElement = document.getElementById('ai-status');
        const toggleAiBtn = document.getElementById('toggle-ai-btn');
        const startBtn = document.getElementById('start-btn');
        const resultMessage = document.getElementById('result-message');

        let classifier, mobilenetModel, trainingTimer;
        const exampleCounts = [0, 0, 0];
        const handSymbols = ["✊", "✌️", "✋"];

        let currentPrediction = -1;
        let isPlaying = false;
        let isAiActive = false;

        async function init() {
            classifier = knnClassifier.create();
            mobilenetModel = await mobilenet.load();

            // ==================================================
            // ★変更: 初回アクセス時のみユーザーに確認する処理
            // ==================================================
            const datasetStr = localStorage.getItem("jankenKNNData");
            
            if (datasetStr) {
                // セッション（そのブラウザタブを開いている間）で既に確認したかをチェック
                const hasAsked = sessionStorage.getItem("hasAskedLoadData");
                let shouldUseData = true; // デフォルトは「使う」

                // 初めてページを開いた時だけ確認ダイアログを出す
                if (!hasAsked) {
                    shouldUseData = confirm("前回の学習データが残っています。\nこのデータを使って再開しますか？\n\n（「キャンセル」を押すと古いデータを消去して、初めから学習します）");
                    // 確認したという記録を残す（以降のタブ切り替えでは聞かれない）
                    sessionStorage.setItem("hasAskedLoadData", "true");
                }

                if (shouldUseData) {
                    // OKが押された、または確認済みの場合はデータを読み込む
                    const datasetObj = JSON.parse(datasetStr);
                    const dataset = {};
                    
                    Object.keys(datasetObj).forEach((key) => {
                        const { data, shape } = datasetObj[key];
                        dataset[key] = tf.tensor2d(data, shape);
                    });
                    classifier.setClassifierDataset(dataset); 
                    
                    Object.keys(datasetObj).forEach((key) => {
                        const classId = parseInt(key);
                        exampleCounts[classId] = datasetObj[key].shape[0];
                        const btnLabels = ["✊ グー追加", "✌️ チョキ追加", "✋ パー追加"];
                        const btnIds = ["btn-rock", "btn-scissors", "btn-paper"];
                        document.getElementById(btnIds[classId]).innerText = `${btnLabels[classId]} (${exampleCounts[classId]})`;
                    });
                    console.log("保存されたデータを読み込みました");
                } else {
                    // キャンセルが押された場合はデータを消去して初めから
                    localStorage.removeItem("jankenKNNData");
                    console.log("古い学習データを破棄し、新規で開始します");
                }
            }
            // ==================================================

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 224, height: 224 }, audio: false });
                videoElement.srcObject = stream;
                videoElement.addEventListener('playing', () => {
                    isAiActive = true;
                    toggleAiBtn.disabled = false;
                    enableTrainingButtons(true);
                    
                    // データが揃っていれば、メッセージを変更してスタートボタンを有効化
                    if (exampleCounts[0] > 0 && exampleCounts[1] > 0 && exampleCounts[2] > 0) {
                        statusElement.innerText = "AI: 稼働中！(データ読込済み✨)";
                        resultMessage.innerText = "準備OK！スタートボタンを押してね";
                    } else {
                        statusElement.innerText = "AI: 稼働中！まずは手を学習させてください。";
                    }
                    
                    predictLoop();
                });
            } catch (err) {
                statusElement.innerText = "カメラの起動に失敗しました。";
            }
        }

        window.toggleAI = function () {
            isAiActive = !isAiActive;
            if (isAiActive) {
                toggleAiBtn.innerText = "⏸ AIを一時停止 (発熱対策)";
                toggleAiBtn.style.backgroundColor = "#ffc107";
                toggleAiBtn.style.color = "#333";
                statusElement.innerText = "AI: 稼働中！";
                statusElement.style.color = "#007bff";
                enableTrainingButtons(true);
                predictLoop();
            } else {
                toggleAiBtn.innerText = "▶️ AIを再開する";
                toggleAiBtn.style.backgroundColor = "#28a745";
                toggleAiBtn.style.color = "white";
                statusElement.innerText = "AI: 一時停止中 (端末を冷却しています ❄️)";
                statusElement.style.color = "#6c757d";
                enableTrainingButtons(false);
                startBtn.disabled = true;
            }
        }

        function enableTrainingButtons(enable) {
            document.getElementById('btn-rock').disabled = !enable;
            document.getElementById('btn-scissors').disabled = !enable;
            document.getElementById('btn-paper').disabled = !enable;

            if (enable && exampleCounts[0] > 0 && exampleCounts[1] > 0 && exampleCounts[2] > 0) {
                startBtn.disabled = false;
            }
        }

        function addExample(classId) {
            const img = tf.browser.fromPixels(videoElement);
            const features = mobilenetModel.infer(img, true);
            classifier.addExample(features, classId);
            img.dispose();

            exampleCounts[classId]++;
            const btnLabels = ["✊ グー追加", "✌️ チョキ追加", "✋ パー追加"];
            const btnIds = ["btn-rock", "btn-scissors", "btn-paper"];
            document.getElementById(btnIds[classId]).innerText = `${btnLabels[classId]} (${exampleCounts[classId]})`;

            if (exampleCounts[0] > 0 && exampleCounts[1] > 0 && exampleCounts[2] > 0 && isAiActive) {
                startBtn.disabled = false;
                if (resultMessage.innerText === "全ての形を学習させたらスタート！") {
                    resultMessage.innerText = "準備OK！スタートボタンを押してね";
                }
            }
        }

        function startTraining(classId) { if (isAiActive) { addExample(classId); trainingTimer = setInterval(() => addExample(classId), 100); } }
        function stopTraining() { clearInterval(trainingTimer); }

        async function predictLoop() {
            if (!isAiActive) return;

            if (classifier.getNumClasses() > 0) {
                const img = tf.browser.fromPixels(videoElement);
                const features = mobilenetModel.infer(img, 'conv_preds');
                const result = await classifier.predictClass(features);

                if (!isPlaying) {
                    currentPrediction = parseInt(result.label);
                }

                for (let i = 0; i < 3; i++) {
                    const probability = result.confidences[i] || 0;
                    const percent = Math.round(probability * 100);
                    document.getElementById(`prob-${i}`).innerText = `${handSymbols[i]} ${percent}%`;

                    if (result.label == i && percent > 50) {
                        document.getElementById(`prob-${i}`).style.backgroundColor = '#ffeaa7';
                        document.getElementById(`prob-${i}`).style.borderColor = '#fdcb6e';
                    } else {
                        document.getElementById(`prob-${i}`).style.backgroundColor = '#f8f9fa';
                        document.getElementById(`prob-${i}`).style.borderColor = '#ddd';
                    }
                }
                img.dispose();
            }

            if (isAiActive) {
                await tf.nextFrame();
                predictLoop();
            }
        }

        window.startJanken = function () {
            // ==================================================
            // ★追加: ゲームスタート時に裏側で自動保存する処理
            // ==================================================
            if (classifier && classifier.getNumClasses() > 0) {
                const dataset = classifier.getClassifierDataset();
                const datasetObj = {};
                Object.keys(dataset).forEach((key) => {
                    const tensor = dataset[key];
                    datasetObj[key] = { data: Array.from(tensor.dataSync()), shape: tensor.shape };
                });
                localStorage.setItem("jankenKNNData", JSON.stringify(datasetObj));
                console.log("学習データを自動保存しました"); // 開発用コンソールにだけ通知
            }
            // ==================================================

            isPlaying = true;
            startBtn.disabled = true;
            
            // iPad等のダミー発話処理
            const dummy = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(dummy);
            
            document.getElementById("player-hand").innerText = "✊";
            document.getElementById("cpu-hand").innerText = "✊";
            resultMessage.style.color = "#333";

            resultMessage.innerText = "最初はグー！";
            setTimeout(() => { resultMessage.innerText = "じゃんけん..."; }, 1200);
            setTimeout(() => {
                resultMessage.innerText = "ポン！";
                judgeGame();
            }, 2400);
        }

        function judgeGame() {
            const cpuChoice = Math.floor(Math.random() * 3);
            document.getElementById("player-hand").innerText = handSymbols[currentPrediction];
            document.getElementById("cpu-hand").innerText = handSymbols[cpuChoice];

            const result = (currentPrediction - cpuChoice + 3) % 3;

            // ★変更: ここでブロックから文字を取得する関数を呼び出します★
            if (result === 0) {
                resultMessage.innerText = "あいこ！";
                resultMessage.style.color = "#333";
                speakResult("あいこです"); 
            } else if (result === 1) {
                resultMessage.innerText = "あなたの負け...";
                resultMessage.style.color = "#007bff";
                executeBlocklyReaction("lose"); // ブロック連動（負け）
            } else if (result === 2) {
                resultMessage.innerText = "あなたの勝ち！🎉";
                resultMessage.style.color = "#ff4500";
                executeBlocklyReaction("win"); // ブロック連動（勝ち）
            }

            if (isAiActive) startBtn.disabled = false;
            setTimeout(() => { isPlaying = false; }, 2000);
        }

        function resetModel() {
            classifier.clearAllClasses();
            for (let i = 0; i < 3; i++) {
                exampleCounts[i] = 0;
                document.getElementById(`prob-${i}`).innerText = `${handSymbols[i]} 0%`;
                document.getElementById(`prob-${i}`).style.backgroundColor = '#f8f9fa';
            }
            document.getElementById('btn-rock').innerText = "✊ グー追加 (0)";
            document.getElementById('btn-scissors').innerText = "✌️ チョキ追加 (0)";
            document.getElementById('btn-paper').innerText = "✋ パー追加 (0)";
            startBtn.disabled = true;
            resultMessage.innerText = "全ての形を学習させたらスタート！";
        }

        function speakResult(text) {
            const soundCheckbox = document.getElementById('sound-checkbox');
            // チェックボックスが存在し、かつチェックが外れている場合のみ喋らない（コメントアウト対応）
            if (soundCheckbox && !soundCheckbox.checked) {
                return;
            }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP'; 
            utterance.rate = 1.0;     
            utterance.pitch = 1.0;    
            window.speechSynthesis.speak(utterance);
        }

        // =========================================================
        // ▼▼▼ ここからBlockly（ブロックプログラミング）の設定 ▼▼▼
        // =========================================================

        const customBlocks = [
            {
                "type": "cmd_start",
                "message0": "プログラムスタート",
                "nextStatement": null,
                "colour": "#ffbf00",
                "tooltip": "マイコン側で待機処理を行います"
            },
            {
                "type": "cmd_if_else",
                "message0": "もし ～なら %1",
                "args0": [{"type": "input_value", "name": "if_jeken"}],
                "message1": "YES %1",
                "args1": [{"type": "input_statement", "name": "yes"}],
                "message2": "NO %1",
                "args2": [{"type": "input_statement", "name": "no"}],
                "previousStatement": null,
                "nextStatement": null,
                "colour": "#ffab19",
                "tooltip": "分岐処理を行います"
            },
            {
                "type": "if_block_win",
                "message0": "じゃんけんに勝ったなら",
                "output": null,
                "colour": "#59c059"
            },
            {
                "type": "if_block_lose",
                "message0": "じゃんけんに負けたなら",
                "output": null,
                "colour": "#59c059"
            },
            {
                "type": "cmd_speak_win",
                "message0": " %1 としゃべる",
                "args0": [{
                    "type": "field_input",
                    "name": "TEXT",
                    "text": "あなたのかち" 
                }],
                "previousStatement": null,
                "nextStatement": null,
                "colour": 160
            },
            {
                "type": "cmd_speak_lose",
                "message0": " %1 としゃべる",
                "args0": [{
                    "type": "field_input",
                    "name": "TEXT",
                    "text": "あなたのまけ" 
                }],
                "previousStatement": null,
                "nextStatement": null,
                "colour": 160
            },
            {
                "type": "cmd_janken",
                "message0": "じゃんけんをする",
                "previousStatement": null,
                "nextStatement": null,
                "colour": 180
            }
        ];

        // ブロックの登録
        Blockly.defineBlocksWithJsonArray(customBlocks);

        // ワークスペースの初期化
        let workspace;
        window.onload = function() {
            init(); // カメラとAIの初期化

            // Blocklyのワークスペースを配置
            //  workspace = Blockly.inject('blocklyDiv', {
            //     toolbox: `
            //     <xml>
            //         <block type="cmd_start"></block>
            //         <block type="cmd_if_else"></block>
            //         <block type="cmd_janken"></block>
            //         <block type="if_block_win"></block>
            //         <block type="if_block_lose"></block>
            //         <block type="cmd_speak_win"></block>
            //         <block type="cmd_speak_lose"></block>
            //     </xml>
            //   `
            // }); 

            // Blocklyのワークスペースを配置（toolboxの記述を消す）
            workspace = Blockly.inject('blocklyDiv', {
                // ツールボックスの設定を丸ごと削除し、代わりに画面を操作するオプションを入れます
                //trashcan: true, // ブロックを削除できるようにゴミ箱を表示
				readOnly: false,	//編集不可
                move: {
                    scrollbars: true, // 画面のスクロールを許可
                    drag: true,       // 画面のドラッグ移動を許可
                    wheel: true       // マウスホイールでの移動を許可
                }
            });
            // =========================================================
            // ★ここから：最初から配置しておきたいブロックの定義（最新のJSON形式）
            // =========================================================
            const defaultBlocksJson = {
                "blocks": {
                    "blocks": [
                        {
                            "type": "cmd_start",
                            "x": 40,  // 横の位置
                            "y": 40,  // 縦の位置
                            "next": {
                                "block": {
                                    "type": "cmd_if_else",
                                    "inputs": {
                                        "if_jeken": {
                                            "block": {
                                                "type": "if_block_win"
                                            }
                                        },
                                        "yes": {
                                            "block": {
                                                "type": "cmd_speak_win"
                                            }
                                        },
                                        "no": {
                                            "block": {
                                                "type": "cmd_speak_lose"
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    ]
                }
            };

            // JSONデータを読み込んでワークスペースにブロックを配置
            Blockly.serialization.workspaces.load(defaultBlocksJson, workspace);
            // =========================================================
            // ★ここまでを追加
            // =========================================================
        };
		

        // ★追加: じゃんけんの勝敗に合わせてブロックを読み取る関数★
        window.executeBlocklyReaction = function(result) {
            if (!workspace) return; // まだワークスペースが無ければ何もしない

            const allBlocks = workspace.getAllBlocks(false);

            if (result === "win") {
                const speakWinBlock = allBlocks.find(block => block.type === 'cmd_speak_win');
                if (speakWinBlock) {
                    // ブロックがあればその文字を喋る
                    speakResult(speakWinBlock.getFieldValue('TEXT'));
                } else {
                    // ブロックが無い場合のデフォルト音声
                    speakResult("あなたの勝ちです"); 
                }
            } else if (result === "lose") {
                const speakLoseBlock = allBlocks.find(block => block.type === 'cmd_speak_lose');
                if (speakLoseBlock) {
                    // ブロックがあればその文字を喋る
                    speakResult(speakLoseBlock.getFieldValue('TEXT'));
                } else {
                    // ブロックが無い場合のデフォルト音声
                    speakResult("私の勝ちです"); 
                }
            }
        }

        // ==========================================
        // 追加: AIの学習データの保存と読み込み処理
        // ==========================================

        // ① データを保存する関数
        window.saveKNN = function() {
            if (!classifier || classifier.getNumClasses() === 0) {
                alert("保存する学習データがありません。先に手を学習させてください。");
                return;
            }
            // AIから現在のデータを取り出す
            const dataset = classifier.getClassifierDataset();
            const datasetObj = {};
            
            // AIのデータ（Tensor）はそのままでは保存できないため、数値の配列に変換する
            Object.keys(dataset).forEach((key) => {
                const tensor = dataset[key];
                datasetObj[key] = {
                    data: Array.from(tensor.dataSync()),
                    shape: tensor.shape
                };
            });
            
            // ブラウザの「localStorage」という場所にテキストとして保存
            localStorage.setItem("jankenKNNData", JSON.stringify(datasetObj));
            alert("学習データをブラウザに保存しました！\n別のページに移動して「データを読込」を押してください。");
        }

        // ② データを読み込む関数
        window.loadKNN = function() {
            const datasetStr = localStorage.getItem("jankenKNNData");
            if (!datasetStr) {
                alert("保存された学習データが見つかりません。");
                return;
            }
            
            const datasetObj = JSON.parse(datasetStr);
            const dataset = {};
            
            // 数値の配列からAI用のデータ（Tensor）に復元する
            Object.keys(datasetObj).forEach((key) => {
                const { data, shape } = datasetObj[key];
                dataset[key] = tf.tensor2d(data, shape);
            });
            
            // 復元したデータをAIにセットする
            classifier.setClassifierDataset(dataset);
            
            // ボタンの表示（学習回数）も更新する
            Object.keys(datasetObj).forEach((key) => {
                const classId = parseInt(key);
                const count = datasetObj[key].shape[0]; // 学習した枚数
                exampleCounts[classId] = count;
                
                const btnLabels = ["✊ グー追加", "✌️ チョキ追加", "✋ パー追加"];
                const btnIds = ["btn-rock", "btn-scissors", "btn-paper"];
                document.getElementById(btnIds[classId]).innerText = `${btnLabels[classId]} (${count})`;
            });
            
            // 全ての形が揃っていればスタートボタンを有効にする
            if (exampleCounts[0] > 0 && exampleCounts[1] > 0 && exampleCounts[2] > 0) {
                if (isAiActive) startBtn.disabled = false;
                resultMessage.innerText = "準備OK！スタートボタンを押してね";
            }
            
            alert("保存されていた学習データを読み込みました！");
        }

        // =========================================================
        // ★修正: 親ページ(index.html)から呼び出される停止関数
        // =========================================================
        window.stopAI = function() {
            // すでに停止済みなら何もしない
            if (!isAiActive && (!videoElement || !videoElement.srcObject)) return;

            // 1. AIの推論ループを停止
            isAiActive = false;

            // 2. カメラの接続を完全に切断する
            if (videoElement && videoElement.srcObject) {
                const tracks = videoElement.srcObject.getTracks();
                tracks.forEach(track => {
                    track.stop();
                    console.log("カメライトをオフにしました: ", track.label);
                });
                videoElement.srcObject = null;
            }
            
            console.log("AIとカメラを安全に停止しました。");
        };

        // ※保険として、最新のブラウザ推奨の pagehide イベントでも呼ぶようにしておく
        window.addEventListener('pagehide', window.stopAI);
    </script>

</body>

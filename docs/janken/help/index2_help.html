<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ステップ2 ヘルプ</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        h1 { color: #007bff; }
    </style>
</head>
<body>
    <h1>ステップ2の使い方</h1>
    <p>ここでは、AIとじゃんけんをしてみましょう。</p>
    <ul>
        <li><strong>カメラに手を映して</strong>、勝負する手を決めてください。</li>
        <li>右側の「ゲームスタート」ボタンを押すと、じゃんけんが始まります。</li>
        <li>あなたの出した手と、CPU（コンピュータ）の出した手でじゃんけんをして、勝敗が決まります。</li>
        <li>じゃんけんに勝った場合は、スピーカーから「あなたのかち」と声が聞こえます。</li>
    </ul>
    <p>ここでは、プログラムの変更はできません。</p>
</body>
</html>

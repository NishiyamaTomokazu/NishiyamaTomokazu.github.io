<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI物体判定アプリ (授業用)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .app-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 900px; margin: 0 auto; }
        .panel { background-color: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 320px; }
        
        .video-container { margin: 10px auto; width: 100%; max-width: 300px; border-radius: 8px; overflow: hidden; background-color: #000; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        
        .training-panel { background: #e9ecef; border-radius: 8px; padding: 15px; margin-top: 15px; text-align: left; }
        .train-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .name-input { font-size: 16px; padding: 8px; width: 40%; border: 1px solid #ccc; border-radius: 4px; }
        .train-btn { font-size: 14px; padding: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; width: 50%; font-weight: bold; }
        #btn-0 { background-color: #e74c3c; }
        #btn-1 { background-color: #2ecc71; }
        #btn-2 { background-color: #3498db; }
        .train-btn:active { opacity: 0.8; }

        .result-box { background-color: #fff8e1; border: 2px dashed #ffc107; border-radius: 10px; padding: 30px; margin: 20px 0; min-height: 80px;}
        .result-name { font-size: 32px; font-weight: bold; color: #333; margin: 0; transition: color 0.3s; }
        .result-prob { font-size: 20px; color: #666; margin-top: 10px; }
        
        #start-btn { font-size: 20px; font-weight: bold; padding: 15px; cursor: pointer; border: none; border-radius: 8px; background-color: #ff4500; color: white; width: 100%; transition: background-color 0.3s;}
        #start-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .reset-btn { padding: 8px 15px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;}
    </style>
</head>
<body>

<h1>AI物体判定アプリ</h1>
<div id="ai-status" style="font-weight: bold; color: #007bff; margin-bottom: 15px;">AI: 起動準備中... (少々お待ちください)</div>

<div class="app-container">
    <div class="panel">
        <h2>1. 物体を学習させる</h2>
        <div class="video-container">
            <video id="webcam" autoplay playsinline width="224" height="224"></video>
        </div>

        <div class="training-panel">
            <p style="margin-top:0; font-size:14px; text-align:center;">名前を入力し、ボタンを長押しして学習</p>
            
            <div class="train-row">
                <input type="text" id="name-0" class="name-input" value="りんご" placeholder="物体1の名前">
                <button id="btn-0" class="train-btn" onmousedown="startTraining(0)" onmouseup="stopTraining()" onmouseleave="stopTraining()">学習追加 (0)</button>
            </div>
            <div class="train-row">
                <input type="text" id="name-1" class="name-input" value="みかん" placeholder="物体2の名前">
                <button id="btn-1" class="train-btn" onmousedown="startTraining(1)" onmouseup="stopTraining()" onmouseleave="stopTraining()">学習追加 (0)</button>
            </div>
            <div class="train-row">
                <input type="text" id="name-2" class="name-input" value="バナナ" placeholder="物体3の名前">
                <button id="btn-2" class="train-btn" onmousedown="startTraining(2)" onmouseup="stopTraining()" onmouseleave="stopTraining()">学習追加 (0)</button>
            </div>
        </div>
        <button class="reset-btn" onclick="resetModel()">学習データをリセット</button>
    </div>

    <div class="panel">
        <h2>2. AIに判定させる</h2>
        
        <button id="start-btn" onclick="togglePrediction()" disabled>▶️ 判定開始！</button>

        <div class="result-box">
            <p style="margin:0; font-size:14px; color:#666;">AIの判定結果</p>
            <div class="result-name" id="result-name">❓❓❓</div>
            <div class="result-prob" id="result-prob">確率: --%</div>
        </div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('webcam');
    const statusElement = document.getElementById('ai-status');
    const startBtn = document.getElementById('start-btn');
    const resultName = document.getElementById('result-name');
    const resultProb = document.getElementById('result-prob');
    
    let classifier, mobilenetModel, trainingTimer;
    const exampleCounts = [0, 0, 0];
    
    let isPredicting = false; 

    // --- 1. 初期化 ---
    async function init() {
        classifier = knnClassifier.create();
        mobilenetModel = await mobilenet.load();
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 224, height: 224 }, audio: false });
            videoElement.srcObject = stream;
            videoElement.addEventListener('playing', () => {
                statusElement.innerText = "AI: 準備完了！名前を決めて物体を学習させてください。";
            });
        } catch (err) {
            statusElement.innerText = "カメラの起動に失敗しました。カメラの許可設定を確認してください。";
        }
    }

    // --- 2. 学習処理 ---
    function addExample(classId) {
        const img = tf.browser.fromPixels(videoElement);
        const features = mobilenetModel.infer(img, true);
        classifier.addExample(features, classId);
        img.dispose(); 
        
        exampleCounts[classId]++;
        document.getElementById(`btn-${classId}`).innerText = `学習追加 (${exampleCounts[classId]})`;

        if (exampleCounts[0] > 0 && exampleCounts[1] > 0 && exampleCounts[2] > 0) {
            startBtn.disabled = false;
        }
    }

    function startTraining(classId) { 
        addExample(classId); 
        trainingTimer = setInterval(() => addExample(classId), 100); 
    }
    function stopTraining() { clearInterval(trainingTimer); }

    // --- 3. リアルタイム推論ループ ---
    async function predictLoop() {
        if (!isPredicting) return;

        if (classifier.getNumClasses() > 0) {
            const img = tf.browser.fromPixels(videoElement);
            const features = mobilenetModel.infer(img, 'conv_preds');
            const result = await classifier.predictClass(features);
            
            const classId = result.label; 
            const probability = result.confidences[classId] || 0;
            const percent = Math.round(probability * 100);
            
            const objectName = document.getElementById(`name-${classId}`).value || `物体 ${parseInt(classId) + 1}`;
            
            // 【追加】確率に応じたメッセージと文字色の変更ロジック
            if (percent >= 90) {
                resultName.innerText = `✨ ${objectName}`;
                resultName.style.color = "#28a745"; // 緑（確信）
            } else if (percent >= 80) {
                resultName.innerText = `${objectName} かも...`;
                resultName.style.color = "#fd7e14"; // オレンジ（少し自信ない）
            } else if (percent >= 40) {
                resultName.innerText = "🤔 AIが迷っています...";
                resultName.style.color = "#6c757d"; // グレー（迷い）
            } else {
                resultName.innerText = "👀 もっとよく見せてください";
                resultName.style.color = "#dc3545"; // 赤（見えない）
            }
            
            resultProb.innerText = `確率: ${percent}%`;
            
            img.dispose();
        }
        
        await tf.nextFrame(); 
        predictLoop(); 
    }

    // --- 4. 判定 開始/停止 の切り替えフロー ---
    window.togglePrediction = function() {
        if (!isPredicting) {
            isPredicting = true;
            startBtn.innerText = "⏸️ 判定を停止する";
            startBtn.style.backgroundColor = "#dc3545";
            predictLoop(); 
        } else {
            isPredicting = false;
            startBtn.innerText = "▶️ 判定を再開する";
            startBtn.style.backgroundColor = "#28a745";
            
            resultName.innerText = "⏸️ AI停止中";
            resultName.style.color = "#333";
            resultProb.innerText = "確率: --%";
        }
    }

    // --- 5. リセット処理 ---
    function resetModel() {
        classifier.clearAllClasses();
        isPredicting = false;
        
        for(let i=0; i<3; i++) {
            exampleCounts[i] = 0;
            document.getElementById(`btn-${i}`).innerText = `学習追加 (0)`;
        }
        startBtn.disabled = true;
        startBtn.innerText = "▶️ 判定開始！";
        startBtn.style.backgroundColor = "#ff4500";
        resultName.innerText = "❓❓❓";
        resultName.style.color = "#333";
        resultProb.innerText = "確率: --%";
        statusElement.innerText = "学習データをリセットしました。再度学習させてください。";
    }

    window.onload = init;
</script>

</body>
</html>

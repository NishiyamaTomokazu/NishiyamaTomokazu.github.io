<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ステップ3: 金庫</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>

<body>
    <h2>ステップ3: 顔認証で金庫を開けよう</h2>
    <!-- ▼ 追加：ヘルプボタン ▼ -->
    <div style="text-align: right; width: 100%; max-width: 1200px; margin: 0 auto;">
        <button id="helpBtn" class="help-btn" data-help-file="step3_help.html">❓ ヘルプを見る</button>
    </div>

    <!-- ▼ 追加：ダイアログ本体（普段は隠れています） ▼ -->
    <dialog id="helpDialog">
        <div class="dialog-header">
            <h2>ヘルプ・使い方</h2>
            <button id="closeHelpBtn" class="close-btn">閉じる</button>
        </div>
        <!-- ここに help.html の中身が読み込まれます -->
        <div id="helpContent">読み込み中...</div>
    </dialog>
    <div id="status">AIモデルを読み込んでいます...</div>

    <button id="startCameraBtn" disabled>カメラを起動する</button>
    

    <!-- アプリのレイアウトコンテナ -->
    <div class="app-container" id="mainContent" style="display: none;">

        <!-- 左側：カメラパネル -->
        <div class="panel">
            <h2>カメラ</h2>
            <div class="video-container small-video" id="videoContainer">
                <!-- 320x240の小さなサイズに設定 -->
                <video id="video" width="320" height="240" autoplay muted playsinline></video>
                <canvas id="overlay" width="320" height="240"></canvas>
            </div>
            <div class="controls" id="controls" style="display: none;">
                <!-- 特徴点の表示・非表示を切り替えるチェックボックス -->
                <label
                    style="font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <input type="checkbox" id="showLandmarks" style="transform: scale(1.5); margin: 0;" check>
                    特徴点（顔のライン）を表示する
                </label>
            </div>
        </div>

        <!-- 右側：金庫と操作パネル -->
        <div class="panel">
            <h2>金庫の操作</h2>
            <!-- 金庫の画像（今回は絵文字とCSSで表現） -->
            <div class="safe-box" id="safeBox">
                <div id="safeIcon" class="safe-icon">🔒</div>
                <div id="safeText">金庫はロックされています</div>
            </div>

            <div class="controls" id="controls">
                <input type="text" id="userName" placeholder="登録名を入力">
                <button id="actionBtn">金庫の鍵を開ける</button>
            </div>
        </div>

    </div>

    <script src="./js/app.js"></script>
    <script>
        // app.jsが読み込まれた後、ステップ3用(safeモード)として初期化
        window.onload = () => initApp('safe');
    </script>
</body>

</html>

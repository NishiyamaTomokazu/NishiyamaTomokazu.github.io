<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ステップ2: 認証</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>
  <h2>ステップ2: 顔の認証</h2>
  <!-- ▼ 追加：ヘルプボタン ▼ -->
  <div style="text-align: right; width: 100%; max-width: 1200px; margin: 0 auto;">
    <button id="helpBtn" class="help-btn" data-help-file="step2_help.html">❓ ヘルプを見る</button>
  </div>
  
  <!-- ▼ 追加：ダイアログ本体（普段は隠れています） ▼ -->
  <div id="helpDialog" class="modal-overlay">
    <!-- ★ classの書き間違いを修正しました -->
    <div class="modal-content">
      <!-- ★ 2重になっていた部分を1つにスッキリさせました -->
      <div class="dialog-header">
        <h2>ヘルプ・使い方</h2>
        <button id="closeHelpBtn" class="close-btn">閉じる</button>
      </div>
      <div id="helpContent">読み込み中...</div>
    </div>
  </div>
  
  <div id="status">AIモデルを読み込んでいます...</div>

  <button id="startCameraBtn" disabled>カメラを起動する</button>

  <!-- ★ video-container の後ろに半角スペースを空けて small-video を追加します -->
  <div class="video-container small-video" id="videoContainer" style="display: none;">
    <video id="video" width="320" height="240" autoplay muted playsinline></video>
    <canvas id="overlay" width="320" height="240"></canvas>
  </div>

  <div class="controls" id="controls" style="display: none;">
    <input type="text" id="userName" placeholder="認証する名前を入力">
    <button id="actionBtn">顔認証をする</button>
  </div>

  <script src="./js/app.js"></script>
  <script>
    // app.jsが読み込まれた後、ステップ2用の初期化を行う
    window.onload = () => initApp('authenticate');
  </script>
</body>
</html>

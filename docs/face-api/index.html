<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顔認識 軽量版（Tiny Face Detector）テスト</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f0f0f0;
      font-family: sans-serif;
    }
    #status {
      margin-bottom: 10px;
      font-weight: bold;
      color: #333;
    }
    .video-container {
      position: relative;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      border: 2px solid #ccc;
      border-radius: 8px;
      background-color: #000;
    }
  </style>
</head>
<body>

  <div id="status">1. 軽量モデル(Tiny Face Detector)を読み込んでいます...</div>
  
  <div class="video-container" style="width: 640px; height: 480px;">
    <video id="video" width="640" height="480" autoplay muted playsinline></video>
    <canvas id="overlay" width="640" height="480"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay');
    const statusText = document.getElementById('status');

    async function init() {
      try {
        const MODEL_URL = './models';

        // 【変更点1】 ssdMobilenetv1 ではなく tinyFaceDetector を読み込む
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL)
        ]);
        
        statusText.innerText = "2. カメラの起動許可を待っています...";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;

      } catch (error) {
        console.error(error);
        statusText.innerText = "エラーが発生しました。コンソールを確認してください。";
      }
    }

    video.addEventListener('play', () => {
      statusText.innerText = "3. 認識中... (軽量モード・500ms間隔)";
      
      const displaySize = { width: video.width, height: video.height };
      faceapi.matchDimensions(canvas, displaySize);

      // 【変更点2】 処理間隔を 100ms → 500ms（1秒間に2回）に伸ばして負荷を下げる
      setInterval(async () => {
        
        // 【変更点3】 検出時に TinyFaceDetectorOptions を明示的に指定する
        // ※ inputSize (デフォルト416) を小さくするほど軽く、大きくするほど遠くの顔を検知できます
        const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.3 });
        
        const detections = await faceapi.detectAllFaces(video, options)
                                        .withFaceLandmarks();
        
        const resizedDetections = faceapi.resizeResults(detections, displaySize);
        
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        faceapi.draw.drawDetections(canvas, resizedDetections);
        faceapi.draw.drawFaceLandmarks(canvas, resizedDetections);
        
      }, 500); 
    });

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>顔認証アプリ</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .tabs {
      display: flex;
      gap: 10px;
      padding: 10px 20px;
      margin: 0;
      background-color: #ffffff;
      border-bottom: 2px solid #ccc;
    }
    .tab-btn {
      padding: 10px 20px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #f9f9f9;
      font-size: 16px;
    }
    .tab-btn.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }
    #content-frame {
      flex-grow: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="loadTab('step1.html', this)">ステップ1 (登録)</button>
    <button class="tab-btn" onclick="loadTab('step2.html', this)">ステップ2 (認証)</button>
    <button class="tab-btn" onclick="loadTab('step3.html', this)">ステップ3 (金庫)</button>
    <button class="tab-btn" onclick="loadTab('step4.html', this)">ステップ4 (プログラム)</button>
    <button class="tab-btn" onclick="loadTab('step5.html', this)">ステップ5 (自由製作)</button>
  </div>

  <!-- カメラのストリームデータを保持するためのグローバル変数 -->
  <script>
    window.sharedCameraStream = null;
  </script>

  <iframe id="content-frame" src="step1.html" allow="camera"></iframe>

  <!-- index.html の変更部分（scriptタグ内のみ） -->
  <script>
    // カメラのストリームデータを保持する変数
    window.sharedCameraStream = null;

    // 親画面がカメラの権限を取得・管理する関数を追加
    window.getSharedCamera = async function() {
      // まだカメラが起動していなければ起動する
      if (!window.sharedCameraStream) {
        window.sharedCameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
      }
      return window.sharedCameraStream;
    };

    function loadTab(url, btnElement) {
      const frame = document.getElementById('content-frame');
      
      frame.src = url;

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ステップ5: 自由制作</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>

<body>
  <h2>ステップ5: ブロックを組み合わせてみよう</h2>
  <!-- ▼ 追加：ヘルプボタン ▼ -->
  <div style="text-align: right; width: 100%; max-width: 1200px; margin: 0 auto;">
    <button id="helpBtn" class="help-btn" data-help-file="step5_help.html">❓ ヘルプを見る</button>
  </div>

  <!-- ▼ 追加：ダイアログ本体（普段は隠れています） ▼ -->
  <!-- ▼ 修正：綺麗な <dialog> タグに戻します ▼ -->
  <dialog id="helpDialog">
    <div class="dialog-header">
      <h2>ヘルプ・使い方</h2>
      <button id="closeHelpBtn" class="close-btn">閉じる</button>
    </div>
    <div id="helpContent">読み込み中...</div>
  </dialog>

  <div id="status">AIモデルを読み込んでいます...</div>

  <button id="startCameraBtn" disabled>カメラを起動する</button>
  <p>オーロラクロックを接続するとLEDを点灯させたり、音を鳴らすことができます。</p>
  <div class="app-container" id="mainContent" style="display: none;">

    <!-- ▼ 左側のパネル（カメラ） ▼ -->
    <!-- 変更前： <div class="left-panel"> -->
    <div class="panel">
      <h2>カメラ</h2> <!-- お好みで見出しを追加 -->
      <div class="video-container small-video" id="videoContainer">
        <video id="video" width="320" height="240" autoplay muted playsinline></video>
        <canvas id="overlay" width="320" height="240"></canvas>
      </div>
      <div class="controls" id="controls" style="display: none;">

        <!-- 特徴点の表示・非表示を切り替えるチェックボックス -->
        <label
          style="font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
          <input type="checkbox" id="showLandmarks" style="transform: scale(1.5); margin: 0;" check>
          特徴点（顔のライン）を表示する
        </label>
      </div>
    </div>

    <!-- ▼ 右側のパネル（金庫・ボタン・ブロック） ▼ -->
    <!-- 変更前： <div class="right-panel" style="width: 100%;"> -->
    <div class="panel">
      <h2>金庫とプログラム</h2> <!-- お好みで見出しを追加 -->

      <div class="safe-box" id="safeBox" style="padding: 15px; margin-bottom: 10px;">
        <div id="safeIcon" class="safe-icon" style="font-size: 60px;">🔒</div>
        <div id="safeText">金庫はロックされています</div>
      </div>

      <div class="controls" id="controls">
        <input type="text" id="userName" placeholder="登録名を入力">
        <button id="actionBtn">金庫の鍵を開ける</button>
        <!-- ※ステップ4, 5の場合は接続状況が入ります -->
        <p id="hid-status" style="font-weight: bold; color: red; margin-top: 5px;">未接続</p>
      </div>

      <!-- ★ 追加: 接続確認用のチェックボックス -->
      <div id="auroraConnectedWrapper" style="display: none; margin: 10px 0; font-size: 14px; text-align: left;">
        <input type="checkbox" id="auroraConnected" style="transform: scale(1.2); margin-right: 5px;">
        <label for="auroraConnected">オーロラクロックと接続中（音声をオフ）</label>
      </div>
      <!-- ※ステップ4, 5の場合はここにBlocklyのエリアが入ります -->
      <div style="text-align: left; width: 100%; margin-top: 10px;">
        <p style="margin: 5px 0; font-weight: bold; font-size: 14px;">左のメニューからブロックを引っ張ってつなげよう</p>

        <!-- 部品パレット (step5のみ) -->
        <xml id="toolbox" style="display: none">
          <category name="📁 部品を開く" colour="210">
            <block type="face_auth_speak"></block>
            <block type="face_auth_led"></block>
            <block type="cmd_sound"></block>
          </category>
        </xml>

        <div id="blocklyDiv" style="height: 550px; width: 100%; border: 1px solid #ccc;"></div>
      </div>

    </div>
  </div>

  <script src="./js/blockly_config.js"></script>
  <!-- ★ 修正：端末（OS）の種類を直接判定してファイルを切り替える -->
  <script>
    // iPad（またはiPhone等）かどうかを確実に判定する
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      // iPad等の場合はiPad用プログラムを読み込む
      document.write('<script src="./js/app_ipad.js"><\/script>');
    } else {
      // Windows、Mac、ChromeOS等の場合はWindows用プログラムを読み込む
      document.write('<script src="./js/app_win.js"><\/script>');
    }
  </script>

  <script>
    window.onload = function () {
      // freeモードとして起動
      initApp('blockly_free');

      // ツールボックスを指定してBlocklyを初期化
      window.workspace = Blockly.inject('blocklyDiv', {
        toolbox: document.getElementById('toolbox'),
        readOnly: false,
        move: { scrollbars: true, drag: true, wheel: true }
      });



      // ステップ5用の初期配置を読み込む
      //Blockly.serialization.workspaces.load(defaultBlocksJsonStep5, window.workspace);
      // =========================================================
      // ★ 変更：保存されたプログラムがあれば復元し、なければ初期配置を読み込む
      // =========================================================
      const savedData = localStorage.getItem('savedBlockly_blockly_free');
      if (savedData) {
        // 保存されたデータが見つかった場合は復元する
        Blockly.serialization.workspaces.load(JSON.parse(savedData), window.workspace);
      } else {
        // 初回など、保存データがない場合は初期配置を読み込む
        Blockly.serialization.workspaces.load(defaultBlocksJsonStep5, window.workspace);
      }
      // =========================================================

      // リサイズ処理
      const blocklyDiv = document.getElementById('blocklyDiv');
      const resizeObserver = new ResizeObserver(() => {
        Blockly.svgResize(window.workspace);
      });
      resizeObserver.observe(blocklyDiv);
    };
  </script>
</body>

</html>

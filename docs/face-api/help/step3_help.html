<h3>ステップ３のヘルプ</h3>
<ul>
  <li>「登録名を入力」に名前を入力してください。</li>
  <li>「金庫の鍵を開ける」ボタンを押すと、顔認証が成功すれば金庫の鍵が開きます。。</li>
</ul>
<h3>試してみよう</h3>
<p>
  カメラ画像の下に「特徴点（顔のライン）を表示する」というチェックボックスがあります。<br>
  チェックを入れると、顔の特徴点が表示されます。顔認証のプログラムは、この特徴点を調べて、認証を行っています。<br>
  顔の一部を手で隠したりして、認証が成功するのか試してみよう。<br>
  自分の写真でも金庫が開くのか試してみよう。<br>
</p>

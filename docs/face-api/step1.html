<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ステップ1: 登録</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

</head>

<body>
  <h2>ステップ1: 顔の登録</h2>


  <div id="status">AIモデルを読み込んでいます...</div>

  <button id="startCameraBtn" disabled>カメラを起動する</button>

  <!-- ★ video-container の後ろに半角スペースを空けて small-video を追加します -->
  <div class="video-container small-video" id="videoContainer" style="display: none;">
    <video id="video" width="320" height="240" autoplay muted playsinline></video>
    <canvas id="overlay" width="320" height="240"></canvas>
  </div>

  <div class="controls" id="controls" style="display: none;">
    <input type="text" id="userName" placeholder="登録する名前を入力">
    <button id="actionBtn">この顔を登録する</button>
  </div>

  <!-- ★ 修正：端末（OS）の種類を直接判定してファイルを切り替える -->
  <script>
    // iPad（またはiPhone等）かどうかを確実に判定する
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      // iPad等の場合はiPad用プログラムを読み込む
      document.write('<script src="./js/app_ipad.js"><\/script>');
    } else {
      // Windows、Mac、ChromeOS等の場合はWindows用プログラムを読み込む
      document.write('<script src="./js/app_win.js"><\/script>');
    }
  </script>

  <script>
    // app.jsが読み込まれた後、ステップ1用の初期化を行う
    window.onload = () => initApp('register');
  </script>
</body>

</html>
